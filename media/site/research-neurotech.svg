<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Personalized human augmentation research visual</title>
  <desc id="desc">A human body with wearable sensors and exoskeleton hardware connected to AI model layers that optimize performance from personalized data.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="0.52" stop-color="#f6fff9"/>
      <stop offset="1" stop-color="#edfaff"/>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#078c88"/>
      <stop offset="0.55" stop-color="#2ad4ff"/>
      <stop offset="1" stop-color="#f05d3b"/>
    </linearGradient>
    <linearGradient id="hardwareGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102822"/>
      <stop offset="1" stop-color="#078c88"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#102822" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .body { fill: none; stroke: #078c88; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .exo { fill: none; stroke: #102822; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .exo-thin { fill: none; stroke: #102822; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: .72; }
      .wire { fill: none; stroke: url(#signalGrad); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .wire.flow { stroke-dasharray: 15 17; animation: dash 8s linear infinite; }
      .thin { fill: none; stroke: #102822; stroke-width: 4; stroke-linecap: round; opacity: .56; }
      .label { font: 700 18px Inter, Arial, sans-serif; fill: #102822; letter-spacing: .04em; }
      .micro { font: 600 12px JetBrains Mono, monospace; fill: #65716f; letter-spacing: .13em; text-transform: uppercase; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .58; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset: -320; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .flow { animation: none; } }
    </style>
  </defs>

  <rect width="960" height="720" fill="url(#bgGlow)"/>
  <path d="M58 586 C148 516 247 536 338 486 C455 420 559 454 664 382 C760 316 829 310 910 268" fill="none" stroke="#dff8ed" stroke-width="78" stroke-linecap="round"/>
  <path d="M68 596 C166 538 254 541 346 500 C462 448 562 474 664 414 C758 359 828 348 902 310" fill="none" stroke="url(#signalGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Personalized AI model stack -->
  <g transform="translate(592 78)" filter="url(#softShadow)">
    <rect x="0" y="0" width="286" height="260" rx="18" fill="#ffffff" stroke="#d7ded7"/>
    <text x="28" y="45" class="label">AI MODEL</text>
    <text x="28" y="70" class="micro">personalized optimizer</text>

    <g transform="translate(28 98)">
      <rect x="0" y="0" width="230" height="36" rx="10" fill="#e9fbf8" stroke="#83dcd1"/>
      <rect x="18" y="12" width="72" height="12" rx="6" fill="#078c88"/>
      <rect x="104" y="12" width="92" height="12" rx="6" fill="#2ad4ff" opacity=".68"/>
    </g>
    <g transform="translate(28 148)">
      <rect x="0" y="0" width="230" height="36" rx="10" fill="#fff4df" stroke="#f5b84b"/>
      <path d="M18 24 C48 6 78 30 106 14 C134 0 164 32 202 12" class="thin"/>
    </g>
    <g transform="translate(28 198)">
      <rect x="0" y="0" width="230" height="36" rx="10" fill="#f3f8ff" stroke="#8ccfff"/>
      <path d="M18 18 H55 L68 8 L84 26 L103 13 H140 L158 24 H204" fill="none" stroke="#f05d3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <circle cx="236" cy="60" r="11" fill="#b7e041" class="pulse" filter="url(#glow)"/>
    <circle cx="258" cy="60" r="7" fill="#f05d3b" class="pulse"/>
  </g>

  <!-- Dashboard card with human-specific data -->
  <g transform="translate(84 78)" filter="url(#softShadow)">
    <rect x="0" y="0" width="206" height="132" rx="16" fill="#102822"/>
    <text x="22" y="35" class="micro" fill="#b8c7c4">wearable stream</text>
    <path d="M24 74 H48 L62 48 L78 102 L97 62 L114 74 H154" fill="none" stroke="#b7e041" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="154" cy="74" r="9" fill="#f05d3b" class="pulse"/>
    <path d="M24 110 H174" stroke="#2ad4ff" stroke-width="4" opacity=".45" stroke-linecap="round"/>
  </g>

  <!-- Augmented human -->
  <g transform="translate(250 130)" filter="url(#softShadow)">
    <circle cx="152" cy="70" r="56" fill="#f5b84b"/>
    <path d="M114 70 C128 43 172 42 190 72 C169 63 154 71 139 86 C128 96 118 92 114 70Z" fill="#102822" opacity=".18"/>

    <path d="M152 132 V306" class="body"/>
    <path d="M152 172 C107 198 82 238 61 304" class="body"/>
    <path d="M153 174 C211 195 248 232 276 292" class="body"/>
    <path d="M152 306 C116 368 93 422 67 514" class="body"/>
    <path d="M152 306 C203 366 237 420 278 506" class="body"/>

    <!-- Exoskeleton structure -->
    <path d="M113 154 L88 288 L55 514" class="exo"/>
    <path d="M190 154 L255 292 L304 496" class="exo"/>
    <path d="M110 250 H198" class="exo-thin"/>
    <path d="M94 366 H238" class="exo-thin"/>
    <path d="M61 516 H111 M278 506 H326" class="exo-thin"/>
    <path d="M230 194 L312 150 L368 166" class="exo"/>
    <path d="M368 166 L388 142 M372 180 L407 181 M365 195 L394 215" class="exo-thin"/>

    <!-- Wearable sensor nodes -->
    <circle cx="152" cy="160" r="20" fill="#ffffff" stroke="#f05d3b" stroke-width="8" class="pulse"/>
    <circle cx="61" cy="304" r="17" fill="#ffffff" stroke="#b7e041" stroke-width="8" class="pulse"/>
    <circle cx="276" cy="292" r="17" fill="#ffffff" stroke="#b7e041" stroke-width="8" class="pulse"/>
    <circle cx="67" cy="514" r="17" fill="#ffffff" stroke="#f05d3b" stroke-width="8" class="pulse"/>
    <circle cx="278" cy="506" r="17" fill="#ffffff" stroke="#f05d3b" stroke-width="8" class="pulse"/>
    <circle cx="230" cy="194" r="14" fill="#ffffff" stroke="#2ad4ff" stroke-width="7" class="pulse"/>

    <!-- Sensor labels -->
    <g transform="translate(-14 230)">
      <rect x="0" y="0" width="122" height="34" rx="17" fill="#ffffff" stroke="#d7ded7"/>
      <text x="18" y="22" class="micro">IMU + EMG</text>
    </g>
    <g transform="translate(206 334)">
      <rect x="0" y="0" width="142" height="34" rx="17" fill="#ffffff" stroke="#d7ded7"/>
      <text x="18" y="22" class="micro">assist-as-needed</text>
    </g>
  </g>

  <!-- Closed-loop signal paths -->
  <path d="M410 286 C492 232 535 178 592 184" class="wire flow"/>
  <path d="M592 264 C520 336 447 370 350 356" class="wire flow"/>
  <path d="M560 538 C464 588 350 588 270 548" class="wire flow"/>
  <path d="M292 168 C402 103 498 108 592 150" class="wire flow"/>

  <!-- Outcome tiles -->
  <g transform="translate(612 402)" filter="url(#softShadow)">
    <rect x="0" y="0" width="250" height="170" rx="18" fill="#ffffff" stroke="#d7ded7"/>
    <text x="24" y="43" class="label">OUTPUT</text>
    <text x="24" y="68" class="micro">optimized capability</text>
    <g transform="translate(24 94)">
      <circle cx="24" cy="24" r="22" fill="#e9fbf8" stroke="#078c88" stroke-width="6"/>
      <path d="M62 13 H194 M62 35 H152" class="thin"/>
    </g>
    <g transform="translate(24 138)">
      <circle cx="18" cy="18" r="14" fill="#fff4df" stroke="#f05d3b" stroke-width="5"/>
      <path d="M48 18 H190" class="thin"/>
    </g>
  </g>

  <!-- Small floating tokens -->
  <g opacity=".82">
    <circle cx="504" cy="104" r="8" fill="#2ad4ff" class="pulse"/>
    <circle cx="532" cy="126" r="5" fill="#b7e041" class="pulse"/>
    <circle cx="486" cy="132" r="5" fill="#f05d3b" class="pulse"/>
    <circle cx="874" cy="360" r="8" fill="#2ad4ff" class="pulse"/>
    <circle cx="100" cy="472" r="6" fill="#b7e041" class="pulse"/>
  </g>
</svg>
